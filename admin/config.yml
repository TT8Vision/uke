# DEPRECATED (2026-08-27): the live shop is now edited via Supabase
# (js/admin-editor.js). This Decap CMS no longer feeds the site. Kept for
# reference only. See CLAUDE.md "Live shop editing (Supabase)".
#
# Decap CMS — TT8 Live Editor (production auth via Netlify Identity + Git Gateway)
#
# Production: git-gateway authenticates each editor through Netlify Identity and
# commits to TT8Vision/uke on `main` as the signed-in user. Editors are invited in
# Netlify → Identity; no GitHub account or PAT is exposed to the browser.
#
# Local dev: `local_backend: true` still routes reads/writes through the
# decap-server proxy (`npx decap-server`) on localhost, so /admin runs with NO
# login and NO network GitHub while developing. Netlify ignores this flag.
backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "images/products"
public_folder: "images/products"

# The client edits text and images only — never code, deploy config, or secrets.
collections:
  # ── Products ──────────────────────────────────────────────────────────────
  # A FOLDER collection: one JSON file per product under data/products/, which is
  # the source of truth. Decap loads entries a page at a time and opens exactly one
  # at a time, so 868 products stay responsive — the previous single-file `list`
  # widget re-rendered all 868 rows on every keystroke and froze for ~90s.
  #
  # data/products.json is NOT edited here. It is generated from this folder by
  # `npm run build:catalogue` (Netlify runs it on every push) and the site reads it.
  - name: products
    label: "Products"
    label_singular: "Product"
    folder: "data/products"
    extension: json
    format: json
    create: true
    # The filename IS the id — build-catalogue.mjs treats it as authoritative.
    # id is generated in the preSave hook (admin/index.html), so it is already set
    # by the time this slug is resolved. The client never types it.
    slug: "{{fields.id}}"
    identifier_field: id
    summary: "{{fields.id}} · {{fields.brand}} {{fields.name}} {{fields.volume}}"
    sortable_fields: [id, brand, price]
    # No preview template exists for a product card, and the pane would only add
    # render cost to every keystroke.
    editor:
      preview: false
    fields:
      # Auto-generated on save. Never typed by the client — the featured lists on
      # shop/index reference products by this id, and it is also the filename.
      - { name: id, label: "ID (auto-generated — not editable)", widget: readonly, required: false }

      - { name: brand, label: "Brand", widget: string }
      - { name: name, label: "Product name", widget: string }

      # Some products legitimately have no volume (e.g. the Kent range).
      - { name: volume, label: "Volume / size (optional)", widget: string, required: false }

      - { name: price, label: "Price (R)", widget: number, value_type: float, min: 0, step: 0.01 }

      # Blank means NO sale. Never defaulted to 0.
      - name: oldPrice
        label: "Was-price (R) — leave blank if not on sale"
        widget: number
        value_type: float
        min: 0
        step: 0.01
        required: false

      # Manufacturer code (Kent range only). Read-only where it exists.
      - { name: sku, label: "SKU (read-only)", widget: readonly, required: false }

      - { name: image, label: "Image (URL or images/products/…)", widget: string }

      - name: categories
        label: "Categories"
        widget: select
        multiple: true
        min: 1
        options:
          - { label: "Household Cleaning", value: "cleaning" }
          - { label: "Groceries", value: "groceries" }
          - { label: "Confectionery", value: "confectionery" }
          - { label: "Hot Drinks", value: "hotdrinks" }
          - { label: "Cold Drinks", value: "colddrinks" }
          - { label: "Beers & Ales", value: "beers" }
          - { label: "Cereals & Breakfast", value: "cereals" }
          - { label: "Personal Care & Beauty", value: "personalcare" }
          - { label: "Kent Hairbrushes", value: "kent" }

      # Fixed, closed list. "None" is normalised to null on save so no badge
      # renders. Includes the descriptive tags already in use so editing one of
      # those products can never blank its badge.
      - name: tag
        label: "Badge"
        widget: select
        required: false
        default: "None"
        options:
          - "None"
          - "Best seller"
          - "Popular"
          - "Specialty"
          - "New in"
          - "Handmade"
          - "Premium"
          - "Irish stout"

      - { name: inStock, label: "In stock", widget: boolean, default: true }
      - { name: new, label: "Show in “New in store”", widget: boolean, default: false }

      # Stamped automatically on creation; editable for backdating.
      - name: dateAdded
        label: "Date added"
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        required: false

  # ── Settings ──────────────────────────────────────────────────────────────
  - name: settings
    label: "Settings"
    files:
      - name: promo
        label: "Promo banner"
        file: "data/settings.json"
        format: json
        description: "The scrolling announcement strip at the top of every page."
        fields:
          - name: promo
            label: "Promo banner"
            widget: object
            fields:
              - { name: enabled, label: "Show the promo message", widget: boolean, default: true }
              - { name: message, label: "Message", widget: string }
              - { name: code, label: "Discount code (optional)", widget: string, required: false }
              - { name: link, label: "Link (optional)", widget: string, required: false }

# Netlify deploy for the UK Emporium static site.
#
# Hand-written HTML at the repo root — there is no bundler and no build step.
# The product catalogue is read at runtime from Supabase (see js/supabase-config.js),
# so nothing has to be generated at deploy time. Everything is served as-is.

[build]
  # Publish the repo root — the site pages, /data and /images all live here.
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# The Decap CMS at /admin was retired when Supabase became the source of truth.
# Old bookmarks and invite links would otherwise 404; send them to the home page.
# Staff editing now starts at /login.html.
[[redirects]]
  from = "/admin"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 301
  force = true

# Security headers for every route.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# The staff login is a private surface, not site content — keep it out of search.
[[headers]]
  for = "/login.html"
  [headers.values]
    X-Robots-Tag = "noindex"

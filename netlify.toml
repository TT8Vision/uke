# Netlify deploy for the UK Emporium static site.
#
# Hand-written HTML at the repo root, no framework. The only build step stitches the
# per-product files in data/products/ into data/products.json, which the pages read.

[build]
  publish = "."
  command = "npm run build:catalogue"

[build.environment]
  NODE_VERSION = "20"

# There is no /admin on this site. Send old bookmarks to the home page.
[[redirects]]
  from = "/admin"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 301
  force = true

# Security headers for every route.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
